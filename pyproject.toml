[project]
name = "rexroad-ai"
version = "0.1.0"
description = "Multi-provider AI agent runtime for Rexroad"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.53,<0.54",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15,<2.16",
    "httpx>=0.28,<0.29",
    "openai>=3.17,<4",
    "anthropic>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
